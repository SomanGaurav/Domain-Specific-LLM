[project]
name = "finllm"
version = "0.1.0"
description = "PEFT (LoRA/QLoRA/DoRA) vs RAG for finance-domain QA on a small open LLM, tracked with MLflow"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=0.34",
    "datasets>=3.0",
    "trl>=0.11",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "mlflow>=2.16",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finllm"]

[tool.ruff]
line-length = 100
src = ["src"]
